[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "saup"
version = "1.0.0"
description = "Shift-Aware Adaptive Uncertainty Prediction"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
pythonpath = ["src"]
